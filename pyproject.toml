
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "developer-cli-toolkit"
version = "0.1.0"
description = "A lightweight command-line toolkit for developers"
requires-python = ">=3.10"

[project.scripts]
devtool = "devtool.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
